<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Application Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p class="eyebrow">CAREER WORKSPACE</p><h1>Job Application Tracker</h1><p>Keep every application, interview and follow-up in one place.</p></header>
<section class="stats"><article><b id="total">0</b><span>Applications</span></article><article><b id="interviews">0</b><span>Interviews</span></article><article><b id="offers">0</b><span>Offers</span></article></section>
<form id="jobForm"><input id="company" placeholder="Company" required><input id="role" placeholder="Role / position" required><input id="date" type="date" required><select id="status"><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option><option>Withdrawn</option></select><button>Add application</button></form>
<section><h2>Your applications</h2><div id="jobs"></div></section><p class="note">Data is saved in this browser on this device using localStorage.</p></main><script src="app.js"></script></body></html>
